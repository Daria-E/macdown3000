<h1 dir="ltr" id="adjacent-shortcut-links-issue-25">Adjacent Shortcut Links (Issue #25)</h1>

<p dir="ltr">Two shortcut-style links side by side should both render:</p>

<p dir="ltr"><a href="https://example.com/foo">foo</a> <a href="https://example.com/baz">bar</a></p>

<p dir="ltr">A shortcut link before a reference link:</p>

<p dir="ltr"><a href="https://example.com/first">first</a> <a href="https://example.com/ref">second</a></p>

<p dir="ltr">Multiple shortcut links in sequence:</p>

<p dir="ltr"><a href="https://example.com/one">one</a> <a href="https://example.com/two">two</a> <a href="https://example.com/three">three</a></p>

<p dir="ltr">Shortcut link at end of paragraph before another on next line:</p>

<p dir="ltr"><a href="https://example.com/alpha">alpha</a>
<a href="https://example.com/beta">beta</a></p>
